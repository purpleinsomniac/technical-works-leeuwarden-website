<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Technical Works Leeuwarden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1422;
    --blue:#1E559D;
    --blue-light:#3D7FC9;
    --steel:#8B93A0;
    --bg:#F4F5F7;
    --line: rgba(30,85,157,0.14);
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--white);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .mono{font-family:'JetBrains Mono', monospace; letter-spacing:0.04em;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 32px;}

  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
  }

  .bracket{position:relative;}
  .bracket::before, .bracket::after{
    content:''; position:absolute; width:18px; height:18px;
    border-color:var(--blue-light); border-style:solid; opacity:0.7;
  }
  .bracket::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
  .bracket::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,20,34,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 32px; width:100%;
  }
  .nav-left{display:flex; align-items:center; gap:44px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{height:40px; width:auto; display:block; filter:brightness(0) invert(1);}
  .navlinks{display:flex; gap:28px; font-size:14px; font-weight:500;}
  .navlinks a{position:relative; padding:4px 0; color:var(--white);}
  .navlinks a.current{color:var(--blue-light);}
  .navlinks a::after{
    content:''; position:absolute; left:0; bottom:0; height:2px; width:0;
    background:var(--blue-light); transition:width .25s ease;
  }
  .navlinks a:hover::after, .navlinks a.current::after{width:100%;}
  .nav-cta{
    font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
    background:var(--white); color:var(--ink); padding:11px 20px;
    border:1px solid var(--white);
    transition:background .2s ease, color .2s ease;
  }
  .nav-cta:hover{background:transparent; color:var(--white);}

  /* ---------- PAGE ---------- */
  main{position:relative; flex:1; display:flex; align-items:center; padding:90px 0;}
  .page-head{padding:40px; max-width:640px; margin:0 auto;}
  .tag{font-size:12px; color:var(--blue-light); margin-bottom:14px; display:block;}
  .page-head h1{font-size:clamp(34px,5vw,58px); color:var(--white); text-align:center;}

  /* ---------- FOOTER ---------- */
  footer{padding:26px 0; border-top:1px solid rgba(255,255,255,0.1);}
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    font-size:12.5px; color:var(--steel);
  }

  @media (max-width:820px){
    .navlinks{display:none;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="nav-left">
      <div class="brand">
        <img src="logo.png" alt="Technical Works Leeuwarden logo">
      </div>
      <div class="navlinks">
        <a href="../index.html">Home</a>
        <a href="../over-ons/index.html">Over ons</a>
        <a href="index.html" class="current">Contact</a>
      </div>
    </div>
    <a href="index.html" class="nav-cta">Neem contact op</a>
  </nav>
</header>

<main>
  <div class="grid-bg"></div>
  <div class="wrap" style="position:relative; z-index:2;">
    <div class="page-head bracket">
      <span class="tag mono" style="text-align:center; display:block;">// CONTACT</span>
      <h1>Contact</h1>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Technical Works Leeuwarden</span>
    <span class="mono">TECHNICAL WORKS — LEEUWARDEN</span>
  </div>
</footer>

</body>
</html>
